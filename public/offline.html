<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অফলাইন · Learn Chinese with Kazi Robin</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #071614;
        --bg: #f7fcfc;
        --orange: #fa7d4e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eaf6f5;
          --bg: #020504;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .logo { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-size: 22px; margin: 18px 0 8px; }
      p { font-size: 15px; line-height: 1.7; opacity: 0.75; margin: 0 0 22px; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
        color: #071614;
        background: var(--orange);
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/kr.png" alt="" width="88" height="88" />
      <h1>আপনি এখন অফলাইনে আছেন</h1>
      <p>
        ইন্টারনেট সংযোগ চালু করে আবার চেষ্টা করুন। যেসব পৃষ্ঠা আগে খোলা হয়েছে
        সেগুলো অফলাইনেও দেখা যাবে।
      </p>
      <button onclick="location.reload()">আবার চেষ্টা করুন</button>
    </div>
  </body>
</html>
